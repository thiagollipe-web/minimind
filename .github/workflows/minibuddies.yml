name: MiniBuddies Android
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-buddies/**', '.github/workflows/minibuddies.yml']
  push:
    branches: [main]
    paths: ['android-buddies/**', '.github/workflows/minibuddies.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/test_project.py
        working-directory: android-buddies
      - run: python3 build_family.py --sdk "$ANDROID_HOME"
        working-directory: android-buddies
      - uses: actions/upload-artifact@v4
        with:
          name: minibuddies-android-debug
          path: |
            android-buddies/dist/*.apk
            android-buddies/dist/SHA256.txt
